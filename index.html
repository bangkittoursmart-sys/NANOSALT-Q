<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANOSALT-Q · AIoT Monitoring Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9fc;--card:#fff;--ink:#1c2b3f;--mut:#6b7585;--line:#e8edf3;--navy:#1f3a5f;--blue:#6fa8d6;--blues:#e8f1f9;--sage:#7a9a82;--sages:#e9f0ea;--gold:#d2a53c;--warn:#b7791f;--bad:#b4533c;--sh:0 1px 2px rgba(31,58,95,.04),0 8px 24px rgba(31,58,95,.06);color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Manrope,Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;min-height:100%}
aside{width:244px;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .2s;flex:none;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font-weight:800;letter-spacing:.04em;color:var(--navy);white-space:nowrap}
.brand svg{flex:none}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;color:var(--mut);font-weight:600;margin-bottom:2px;text-align:left;white-space:nowrap}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--navy);color:#fff}
nav svg{width:18px;height:18px;flex:none}
.navgrp{margin-bottom:2px}
.navgh{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;color:var(--mut);font-weight:600;text-align:left;white-space:nowrap}
.navgh:hover{background:var(--bg)}
.navgh svg{width:18px;height:18px;flex:none}
.navgh .chv{margin-left:auto;width:14px!important;height:14px!important;transition:transform .15s;flex:none}
.navgrp.open .navgh{background:var(--bg)}
.navgrp.open .navgh .chv{transform:rotate(180deg)}
.navsub{display:none;margin:2px 0 4px 21px}
.navgrp.open .navsub{display:block}
.navsc{display:flex;align-items:center;gap:10px;width:calc(100% - 8px);margin:0 0 2px 8px;padding:8px 10px;border:0;background:none;border-radius:7px;color:var(--mut);font-weight:600;font-size:12.5px;text-align:left;white-space:nowrap}
.navsc:hover{background:var(--bg)}
.navsc.on{background:var(--navy);color:#fff}
.navsc svg{width:15px;height:15px;flex:none}
.col .navsub,.col .chv{display:none!important}
.sfoot{margin-top:auto;font-size:11px;color:var(--mut);padding:10px 8px;border-top:1px solid var(--line);line-height:1.5}
.col aside{width:70px}.col .brand span,.col nav button span,.col .sfoot{display:none}.col nav button{justify-content:center}
.main{flex:1;min-width:0}
header{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.ib{border:1px solid var(--line);background:none;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;position:relative}
.ib svg{width:18px;height:18px}
header h1{font-size:17px;font-weight:700;line-height:1.2}
header h1 small{display:block;font-size:11px;font-weight:500;color:var(--mut)}
.sp{flex:1}
.tm{text-align:right;line-height:1.25}.tm b{font-size:15px;font-variant-numeric:tabular-nums}.tm small{display:block;color:var(--mut);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sages);color:var(--sage);white-space:nowrap}
.pill.warn{background:#f6ecd8;color:var(--warn)}.pill.bad{background:#f4e2dc;color:var(--bad)}.pill.sim{background:#f6ecd8;color:var(--warn);letter-spacing:.04em}
.pill.demo{background:var(--blues);color:var(--navy)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
#drop{position:absolute;right:28px;top:62px;width:320px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:8px;display:none;max-height:360px;overflow:auto}
#drop.on{display:block}
#view{padding:24px 28px 40px;max-width:1500px}
.sec{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}.sec h2{font-size:22px;font-weight:800;color:var(--navy)}.sec p{color:var(--mut);max-width:640px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;box-shadow:var(--sh);transition:border-color .15s}
.kpi:hover{border-color:var(--blue)}
.ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;flex:none}
.ring svg{width:18px;height:18px}
.kpi small{display:block;color:var(--mut);font-size:11.5px;font-weight:600;margin-bottom:2px}
.kpi b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi em{font-style:normal;font-size:12px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--sh);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{font-size:14.5px;font-weight:700}
.g{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
.cv{position:relative;height:290px}.cv.s{height:230px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px}
.btn:hover{border-color:var(--navy)}.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:12.5px;color:var(--mut)}.seg button.on{background:var(--blues);color:var(--navy)}
ul.ops{list-style:none;padding:0}ul.ops li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}ul.ops li:last-child{border:0}ul.ops span{color:var(--mut);font-size:12.5px}
.tl{list-style:none;padding:0;max-height:260px;overflow:auto}.tl li{display:flex;gap:12px;padding:0 0 14px;position:relative}
.tl li:before{content:"";width:9px;height:9px;border:2px solid var(--sage);border-radius:50%;margin-top:4px;flex:none;background:var(--card)}
.tl li.warn:before{border-color:var(--gold)}.tl li.bad:before{border-color:var(--bad)}
.tl b{display:block;font-weight:600;font-size:13px}.tl small{color:var(--mut);font-size:11px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--sage);transition:width .6s}
.note{font-size:12px;color:var(--mut);line-height:1.55}
.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;background:#f6ecd8;color:#7a5a14;border-radius:10px;margin-bottom:18px;font-size:12.5px;font-weight:600}
.banner svg{width:18px;height:18px;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.rec{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.5}.rec:last-child{border:0}.rec svg{width:17px;height:17px;flex:none;margin-top:2px;color:var(--sage)}.rec.warn svg{color:var(--gold)}
#modal{position:fixed;inset:0;background:rgba(16,23,31,.45);display:none;place-items:center;z-index:60;padding:16px}#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:14px;padding:24px;width:520px;max-width:100%;max-height:90vh;overflow:auto}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--navy);color:#fff;padding:11px 14px;border-radius:10px;font-size:12.5px;font-weight:600;max-width:320px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.warn{background:var(--warn);color:#fff}
.wrap2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1100px){.g2{grid-template-columns:1fr}}
@media (max-width:860px){aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}.open aside{transform:none}.col aside{width:244px}.col .brand span,.col nav button span,.col .sfoot{display:inline}.col nav button{justify-content:flex-start}header{padding:12px 16px}#view{padding:18px 16px 40px}.g3{grid-template-columns:1fr}.tm small{display:none}#drop{right:16px}}
@media print{aside,header,#toasts,.noprint{display:none!important}#view{padding:0}.card{box-shadow:none;break-inside:avoid}}

/* ===== AI CHATBOT PAGE ===== */
.chatpage{display:flex;flex-direction:column;padding:0;overflow:hidden;height:min(72vh,640px);min-height:460px}
#chat-rail-head{background:linear-gradient(135deg,var(--navy) 0%,#2d5a9e 100%);color:#fff;padding:16px 18px 14px;flex:none;display:flex;flex-direction:column;gap:8px;border-radius:12px 12px 0 0}
.crh-top{display:flex;align-items:center;gap:10px}
.crh-top h3{flex:1;font-size:15px;font-weight:800;letter-spacing:.01em}
.crh-top small{font-size:10px;opacity:.65;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#chat-close-rail{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
#chat-close-rail svg{width:15px;height:15px}
#chat-close-rail:hover{background:rgba(255,255,255,.22)}
.crh-status{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.1);border-radius:8px;font-size:11.5px;font-weight:600}
.crh-status .sdot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 6px #4ade80}
.crh-status .sdot.off{background:#f87171;box-shadow:0 0 6px #f87171}
.crh-status span{flex:1}
.crh-status button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:6px;padding:3px 8px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer}
.crh-status button:hover{background:rgba(255,255,255,.3)}
#chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.cm{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word;animation:cmIn .18s ease}
@keyframes cmIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cm.u{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.cm.a{background:var(--bg);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;color:var(--ink)}
.cm.a b{color:var(--navy)}
.cm-typing{display:flex;gap:4px;padding:4px 2px;align-items:center}
.cm-typing span{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:blink 1.2s infinite}
.cm-typing span:nth-child(2){animation-delay:.2s}.cm-typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
#chat-quick{padding:10px 16px 0;display:flex;flex-wrap:wrap;gap:6px;flex:none}
#chat-quick button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font:inherit;font-size:11.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:background .12s,border-color .12s}
#chat-quick button:hover{background:var(--blues);border-color:var(--blue)}
#chat-form{padding:12px 14px 16px;display:flex;gap:8px;border-top:1px solid var(--line);flex:none;background:var(--card)}
#chat-input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);resize:none;line-height:1.4;max-height:100px;overflow-y:auto}
#chat-input:focus{outline:none;border-color:var(--blue);background:var(--card)}
#chat-send{background:var(--navy);color:#fff;border:none;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;align-self:flex-end;transition:background .15s,transform .1s}
#chat-send:hover:not(:disabled){background:#2d5a9e;transform:scale(1.05)}
#chat-send svg{width:17px;height:17px}
#chat-send:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:860px){.chatpage{height:min(78vh,620px)}}
@media print{.chatpage{display:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<aside id="side">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="#1f3a5f" stroke-width="1.5"/><path d="M16 6l7 6-3 10h-8L9 12z" fill="#e8f1f9" stroke="#1f3a5f" stroke-width="1.4" stroke-linejoin="round"/><path d="M16 6v16M9 12h14" stroke="#7a9a82" stroke-width="1.2"/><circle cx="25" cy="7" r="2.6" fill="#d2a53c"/></svg><span>NANOSALT-Q</span></div>
  <nav id="nav"></nav>
  <div class="sfoot"><b>SIMULATED DATA</b><br>Prototype v0.1 · bukan pengukuran lapangan</div>
</aside>
<div class="main">
<header>
  <button class="ib" id="burger" aria-label="Menu"><i data-lucide="menu"></i></button>
  <h1 id="ttl">Overview Dashboard<small>NANOSALT-Q · AIoT Monitoring</small></h1>
  <span class="sp"></span>
  <span class="pill sim"><span class="dot"></span>SIMULATED DATA</span>
  <span class="pill" id="conn"><span class="dot"></span><span>5/5 perangkat online</span></span>
  <div class="tm"><b id="clk">--:--:--</b><small id="dte">-</small></div>
  <button class="ib" id="bell" aria-label="Notifikasi"><i data-lucide="bell"></i><span class="badge" id="bc" style="display:none">0</span></button>
  <div id="drop"></div>
</header>
<main id="view"></main>
</div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script>
/* ========== 1. DEFINISI SENSOR (metadata: label, satuan, desimal, ambang atas) ========== */
const M={
 sun:['Radiasi Matahari','W/m²',0],pvV:['Tegangan PV','V',1],pvI:['Arus PV','A',2],pvP:['Daya Listrik PV','W',0],pvT:['Suhu Panel PV','°C',1,63],eff:['Efisiensi Listrik PV','%',1],
 nfIn:['Suhu Nanofluida Masuk','°C',1],nfOut:['Suhu Nanofluida SiO₂','°C',1,44],flow:['Laju Aliran Fluida','L/mnt',2],absT:['Suhu Lapisan Penyerap','°C',1,52],qT:['Energi Panas Ditransfer','kW',2],thW:['Daya Termal','W',0],
 tesT:['Suhu Tangki Penyimpanan','°C',1,78],tesCap:['Kapasitas Energi Panas','kWh',0],tesE:['Energi Panas Tersimpan','kWh',2],tesAv:['Energi Tersedia','kWh',2],
 pondT:['Suhu Air Garam','°C',1],sal:['Salinitas Air Garam','ppt',1,290],vol:['Volume Air','L',0],evap:['Laju Penguapan','mm/jam',2],hum:['Kelembapan Udara','%',1],prod:['Estimasi Produksi Garam','kg',1]};
const AREA=6, POND_HA=0.25, SAL_TARGET=260;

/* ========== 2. SUMBER DATA (ganti blok ini dengan ESP32 / MQTT / REST / database) ==========
   Kontrak: Sensors.fast() dipanggil tiap 5 dtk (data kecil), Sensors.slow() tiap 20 dtk (data besar).
   Keduanya harus mengisi objek Sensors.s dengan kunci seperti pada M. Contoh REST: s=await (await fetch('/api/latest')).json() */
const r=a=>(Math.random()-.5)*2*a;
const Sensors={n:0,h:9,s:{sun:810,pvV:33,pvI:0,pvP:0,pvT:55,eff:14,nfIn:36,nfOut:46,flow:1.9,absT:54,qT:1,thW:1000,tesT:52,tesCap:40,tesE:16,tesAv:13,pondT:44,sal:214,vol:2400,evap:.5,hum:64,prod:84},
 devices:[['ESP32-PV01','Sensor PV & radiasi',1],['ESP32-TH02','Nanofluida SiO₂',1],['ESP32-TES03','Tangki penyimpanan',1],['ESP32-POND04','Kolam garam',1],['Gateway MQTT','Broker lokal',1]],
 fast(){const s=this.s;this.n++;this.h=9+((this.n*.04)%7);
  const cl=1-.18*Math.abs(Math.sin(this.n/5))-Math.random()*.04;
  s.sun=1000*Math.pow(Math.sin(Math.PI*(this.h-6)/12),.6)*cl;
  s.pvT=26+s.sun*.037+r(.5);s.eff=14.2-.045*(s.pvT-25)+r(.08);s.pvP=s.sun*AREA*s.eff/100;
  s.pvV=30+s.sun/1000*6+r(.2);s.pvI=s.pvP/s.pvV;s.flow=1.6+s.sun/1000*.8+r(.03);
  s.nfIn=33+s.sun*.004+r(.2);s.nfOut=s.nfIn+s.sun*.0105+r(.2);s.absT=s.nfOut+7+r(.3);
  s.qT=s.flow/60*4.18*(s.nfOut-s.nfIn);s.thW=s.qT*1000;s.hum=Math.min(94,Math.max(45,90-s.sun*.028+r(.5)))},
 slow(){const s=this.s;
  s.tesE=Math.min(s.tesCap,s.tesE+s.qT*.06);s.tesT=35+s.tesE/s.tesCap*45;s.tesAv=s.tesE*.82;
  s.pondT=30+s.sun*.018+r(.2);s.evap=Math.max(.05,.08+s.sun*.0008+r(.02));s.vol=Math.max(1000,s.vol-s.evap*.9);
  s.sal=Math.min(300,s.sal+.06*(s.evap/.5));s.prod+=s.evap*.05;
  this.devices.slice(0,4).forEach(d=>{if(!d[2])d[2]=1;else if(Math.random()<.05)d[2]=0})}};

/* ========== 3. STATE, RIWAYAT, ALERT ========== */
const S=Sensors.s,H=[],LOG=[],last={};let cur='overview';
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hms=d=>d.toLocaleTimeString('id-ID',{hour12:false});
const fmt=k=>S[k].toFixed(M[k][2]);
const hm=h=>h<0?'-':Math.floor(h)+' j '+String(Math.round(h%1*60)).padStart(2,'0')+' mnt';
const rate=()=>.06*180*(S.evap/.5);
function snap(){H.push({t:hms(new Date()),...S});if(H.length>24)H.shift()}
function alert_(lvl,msg,key){const now=Date.now();if(key&&last[key]&&now-last[key]<90000)return;if(key)last[key]=now;
 LOG.unshift({t:hms(new Date()),msg,lvl});if(LOG.length>30)LOG.pop();toast(msg,lvl);renderBell()}
function checks(){Object.keys(M).forEach(k=>{if(M[k][3]&&S[k]>M[k][3])alert_('warn',M[k][0]+' melewati ambang '+M[k][3]+' '+M[k][1]+' ('+fmt(k)+')','a'+k)});
 if(S.sal>=SAL_TARGET)alert_('ok','Salinitas mencapai zona kristalisasi (≥ '+SAL_TARGET+' ppt)','cry');
 Sensors.devices.forEach(d=>{if(!d[2])alert_('bad',d[0]+' offline','d'+d[0])})}
function toast(m,l){const t=document.createElement('div');t.className='toast '+(l=='ok'?'':'warn');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),4500)}
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];

/* ========== 4. KOMPONEN UI ========== */
const icons=()=>lucide.createIcons();
const st=(k,ic,c)=>`<button class="kpi" data-open="${k}" style="--c:var(--${c})"><span class="ring"><i data-lucide="${ic}"></i></span><span><small>${M[k][0]}</small><b><span data-k="${k}">${fmt(k)}</span> <em>${M[k][1]}</em></b></span></button>`;
const card=(t,b,x='',c='')=>`<section class="card ${c}"><div class="ch"><h3>${t}</h3>${x}</div>${b}</section>`;
const cvs=(id,c='')=>`<div class="cv ${c}"><canvas id="${id}"></canvas></div>`;

  const{startAngle,endAngle,innerRadius,outerRadius,x,y}=arc.getProps(['startAngle','endAngle','innerRadius','outerRadius','x','y'],true);
  const mid=(startAngle+endAngle)/2,r=(innerRadius+outerRadius)/2,px=x+Math.cos(mid)*r,py=y+Math.sin(mid)*r;
  ctx.save();ctx.fillStyle='#fff';ctx.font='700 11px Manrope,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(Math.round(data[i]/total*100)+'%',px,py);ctx.restore()});

 c._d=defs;if(o.static){if(!c._u)c._u=()=>{}}else refresh(c);return c}
function refresh(c){if(c._u)return c._u(c);c.data.labels=H.map(x=>x.t);c.data.datasets.forEach((d,i)=>d.data=H.map(x=>+x[c._d[i].k].toFixed(2)));c.update('none')}
function csv(name,rows){const b=new Blob(['\ufeff'+rows.map(x=>x.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();toast('CSV diekspor: '+name,'ok')}

function seed(n){let x=n*9301+49297;return()=>((x=(x*9301+49297)%233280)/233280)}
const AP={energi:['Energi PV','kWh'],suhu:['Suhu Panel','°C'],salin:['Salinitas','ppt'],evap:['Penguapan','mm'],prod:['Produksi Garam','kg'],hum:['Kelembapan Udara','%']};
function series(p,per){const rn=seed(p.length*7+per.charCodeAt(0)),n={d:24,w:7,m:30}[per],L=[],V=[],D=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
 for(let i=0;i<n;i++){const j=.9+.2*rn(),s=Math.max(0,Math.sin(Math.PI*(i-6)/12)),d=per=='d';
  L.push(d?String(i).padStart(2,'0')+':00':per=='w'?D[i]:'H'+(i+1));
  V.push(+({energi:d?1.4*s*j:6.5*j,suhu:d?(s?26+34*s*j:24):48+8*rn(),salin:d?205+i*.45:per=='w'?190+i*7+rn()*3:150+i*3.8+rn()*3,evap:d?s*.9*j:5.2*j,prod:d?s*5.5*j:38*j,hum:d?90-s*30*j:70+9*rn()}[p]).toFixed(2))}
 return{L,V}}

const eff=()=>(S.pvP/1000+S.qT)/(S.sun*AREA/1000)*100;
const cry=()=>S.sal>=SAL_TARGET?['Kristalisasi','ok']:S.sal>=230?['Pekat · mendekati kristalisasi','warn']:['Penguapan aktif','ok'];

  .map(a=>`<li><div>${a[0]}<br><span>${a[2]}</span></div>${pill(a[1]=='ok'?'':a[1],a[1]=='ok'?'Normal':a[1]=='warn'?'Perhatian':'Gangguan')}</li>`).join(''),

 anom:()=>{const ex=S.sun*AREA*(14.2-.045*(S.pvT-25))/100,dv=Math.abs(S.pvP-ex)/Math.max(ex,1)*100,a=[];if(S.pvT>63)a.push('Suhu panel tinggi');if(S.sun>400&&S.nfOut-S.nfIn<2)a.push('Delta T nanofluida rendah');if(dv>12)a.push('Daya PV menyimpang '+dv.toFixed(0)+'%');return a.length?a.join(' · '):'Tidak ada anomali'},
 recs:()=>{const a=[];a.push(S.pvT>60?['warn','alert-triangle','Suhu panel mendekati ambang. Periksa aliran nanofluida dan transmisi spektrum.']:['ok','check-circle-2','Suhu panel stabil; konfigurasi spectral splitting bekerja dalam rentang normal.']);
  a.push(S.tesE/S.tesCap>.85?['warn','battery-full','Tangki hampir penuh. Alihkan panas ke kolam atau kurangi laju pengisian.']:['ok','battery-charging','Kapasitas tangki masih luas; lanjutkan pengisian pada jam radiasi puncak.']);
  a.push(S.sal>235?['warn','droplets','Salinitas mendekati zona kristalisasi. Siapkan jadwal panen dan pantau volume air.']:['ok','waves','Salinitas dalam fase penguapan. Pertahankan sirkulasi air kolam.']);
  a.push(Sensors.devices.every(d=>d[2])?['ok','wifi','Semua perangkat online; kualitas data baik.']:['warn','wifi-off','Ada perangkat offline. Periksa daya dan jaringan ESP32 terkait.']);
  return a.map(x=>`<div class="rec ${x[0]}"><i data-lucide="${x[1]}"></i><span>${x[2]}</span></div>`).join('')},
 eff:()=>eff().toFixed(1)+'%',cnt:()=>Sensors.devices.filter(d=>d[2]).length+'/5',
 devs:()=>Sensors.devices.map(d=>`<li><div>${d[0]}<br><span>${d[1]}</span></div>${pill(d[2]?'':'bad',d[2]?'Online':'Offline')}</li>`).join('')
};

Jadikan jawaban singkat, padat, dan actionable. Total maksimal 300 kata.`;
 try{
  const reply=await callGroq([{role:'system',content:getSystemContext()},{role:'user',content:prompt}]);
  const out=$('#ai-groq-out'),body=$('#ai-groq-body'),ts=$('#ai-groq-time'),par=$('#ai-params');
  if(out){

    .replace(/\n/g,'<br>');
   if(body)body.innerHTML=html;

  }
  /* Update parameter panel */
  if(par)par.innerHTML=`
   <div style="display:grid;gap:5px">
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">Model</span><b>${GROQ_MODEL}</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">Sensor dibaca</span><b>${Object.keys(M).length} parameter</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">Snapshot history</span><b>${H.length} data</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">Laju salinitas</span><b>${(rate()/720).toFixed(4)} ppt/dtk</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">Sisa ke target panen</span><b>${(SAL_TARGET-S.sal).toFixed(1)} ppt</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:var(--mut)">Dianalisis</span><b>${new Date().toLocaleTimeString('id-ID')}</b></div>
   </div>`;
  updateAIBanner('done');
  /* Update label */
  const lbl=$('#pred-label');if(lbl){lbl.textContent='PROYEKSI AI ✓';lbl.style.background='var(--sages)';lbl.style.color='var(--sage)'}
 }catch(err){
  updateAIBanner('error',err.message);
  aiLastPage=null; // allow retry
 }}

function updateAIBanner(state,errMsg=''){
 const title=$('#ai-banner-title'),sub=$('#ai-banner-sub'),spin=$('#ai-spinner'),banner=$('#ai-banner');
 if(!title)return;
 if(state==='loading'){
  banner.style.background='var(--blues)';banner.style.color='var(--navy)';
  title.textContent='Groq AI sedang menganalisis...';
  sub.textContent='Model GPT-OSS 120B memproses '+Object.keys(M).length+' parameter sensor real-time.';
  spin.style.display='block';return}
 if(state==='done'){
  banner.style.background='var(--sages)';banner.style.color='var(--sage)';banner.style.borderColor='#b5d4ba';
  title.textContent='✓ Analisis AI selesai · '+new Date().toLocaleTimeString('id-ID');
  sub.textContent='Lihat rekomendasi dan proyeksi di bawah. AI akan menganalisis ulang saat Anda berpindah halaman.';
  spin.style.display='none';return}
 if(state==='error'){
  banner.style.background='#f4e2dc';banner.style.color='var(--bad)';banner.style.borderColor='#e8bdb5';
  title.textContent='⚠ Gagal menghubungi Groq AI';sub.textContent=errMsg;spin.style.display='none';return}
 /* default: menunggu auto-analisis mulai */
 banner.style.background='var(--blues)';banner.style.color='var(--navy)';banner.style.borderColor='#c5dcef';
 title.textContent='AI Monitoring · Menyiapkan analisis...';
 sub.textContent='Groq AI akan menganalisis kondisi sistem secara otomatis beberapa detik lagi.';
 if(spin)spin.style.display='none'}

/* ── Chat Sidebar ── */
function chatMarkdown(t){
 return t
  .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
  .replace(/^- (.*)/gm,'<span style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--sage)">•</span><span>$1</span></span>')
  .replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>')}

function addMsg(role,html,isTyping=false){
 const wrap=$('#chat-msgs'),d=document.createElement('div');
 d.className='cm '+(role==='user'?'u':'a');
 if(isTyping)d.innerHTML='<div class="cm-typing"><span></span><span></span><span></span></div>';
 else d.innerHTML=html;
 wrap.appendChild(d);wrap.scrollTop=wrap.scrollHeight;return d}

async function sendChat(text){
 text=text.trim();if(!text)return;
 const btn=$('#chat-send'),inp=$('#chat-input');
 btn.disabled=true;inp.disabled=true;inp.value='';inp.style.height='auto';
 addMsg('user',text.replace(/</g,'&lt;'));
 chatHistory.push({role:'user',content:text});
 const typing=addMsg('assistant','',true);
 try{
  const reply=await callGroq([{role:'system',content:getSystemContext()},...chatHistory],800);
  typing.innerHTML=chatMarkdown(reply);
  chatHistory.push({role:'assistant',content:reply});
  if(chatHistory.length>18)chatHistory=chatHistory.slice(-16);
 }catch(e){typing.innerHTML='<span style="color:var(--bad)">⚠ '+e.message+'</span>'}
 btn.disabled=false;inp.disabled=false;inp.focus();
 $('#chat-msgs').scrollTop=9999}

function setAIConnected(connected){
 const dot=$('#ai-dot'),lbl=$('#ai-status-label');
 if(!dot||!lbl)return;
 if(connected){dot.className='sdot';lbl.textContent='Terhubung · '+GROQ_MODEL}
 else{dot.className='sdot off';lbl.textContent='Gagal terhubung ke server AI'}}

/* Dipanggil setiap kali halaman AI Chatbot dibuka (lihat P.aichat.c) */
function initChatPage(){
 const msgs=$('#chat-msgs');
 if(chatHistory.length===0){
  msgs.innerHTML='<div class="cm a">👋 Halo! Saya <b>NANOSALT AI</b>, asisten analisis cerdas untuk sistem Anda.<br><br>Tanyakan apa saja seputar kondisi sensor, prediksi panen, atau efisiensi energi — saya akan menganalisis data real-time untuk Anda.</div>';
 }else{
  msgs.innerHTML=chatHistory.map(m=>`<div class="cm ${m.role==='user'?'u':'a'}">${m.role==='user'?m.content.replace(/</g,'&lt;'):chatMarkdown(m.content)}</div>`).join('');
 }
 msgs.scrollTop=msgs.scrollHeight;
 setAIConnected(true);
 $('#chat-send').disabled=false;

 $('#chat-send').onclick=()=>sendChat($('#chat-input').value);
 $('#chat-input').onkeydown=e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat(e.target.value)}};
 $('#chat-input').oninput=function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'};
 $('#chat-quick').onclick=e=>{
  const btn=e.target.closest('[data-q]');
  if(btn)sendChat(btn.dataset.q)};
}
